name: PlataClara
options:
  bundleIdPrefix: com.rojo1112
  deploymentTarget:
    iOS: "17.0"
packages:
  PlataCore:
    path: PlataCore
targets:
  PlataClara:
    type: application
    platform: iOS
    sources: [PlataClara]
    dependencies:
      - package: PlataCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rojo1112.plataclara
        MARKETING_VERSION: "0.5.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PlataClara
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        CODE_SIGNING_ALLOWED: NO
schemes:
  PlataClara:
    build:
      targets:
        PlataClara: all
