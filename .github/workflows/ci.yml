name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pruebas de PlataCore
        run: swift test --package-path PlataCore

      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar app sin firmar
        run: |
          xcodebuild -project PlataClara.xcodeproj -scheme PlataClara -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PlataClara.app Payload/
          zip -qry PlataClara.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PlataClara-ipa
          path: PlataClara.ipa

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" PlataClara.ipa \
            --title "PlataClara $GITHUB_REF_NAME" \
            --notes "Descarga PlataClara.ipa e instálalo con iloader o SideStore. Guía: docs/INSTALACION.md"
