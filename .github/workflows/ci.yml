name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Por defecto solo lectura; solo el trabajo que publica la versión puede escribir.
permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Pruebas de PlataCore
        run: swift test --package-path PlataCore

      - name: Generar proyecto Xcode
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Compilar app sin firmar
        run: |
          xcodebuild -project PlataClara.xcodeproj -scheme PlataClara -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PlataClara.app Payload/
          zip -qry PlataClara.ipa Payload

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PlataClara-ipa
          path: PlataClara.ipa

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PlataClara-ipa

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" PlataClara.ipa \
            --title "PlataClara $GITHUB_REF_NAME" \
            --notes "Descarga PlataClara.ipa e instálalo con iloader o SideStore. Guía: docs/INSTALACION.md"
