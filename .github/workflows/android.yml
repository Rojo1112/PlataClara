name: Android

on:
  push:
    branches: [main]
    tags: ['android-v*']
  pull_request:

# Por defecto solo lectura; solo el trabajo que publica la versión puede escribir.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.9'

      - name: Pruebas y APK de depuración
        run: gradle -p android testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PlataClara.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PlataClara-apk
          path: PlataClara.apk

  release:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: PlataClara-apk

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" PlataClara.apk \
            --title "PlataClara Android ${GITHUB_REF_NAME#android-}" \
            --notes "Descarga PlataClara.apk e instálalo en tu Android. Guía: docs/INSTALACION-ANDROID.md"
